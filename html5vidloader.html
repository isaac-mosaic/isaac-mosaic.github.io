<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Stream Player</title>
    <!-- Include the HLS.js library from a CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- Standard HTML5 Video Tag -->
    <video id="my-video" controls width="640" height="360"></video>

    <script>
        // The URL of the video stream (Notice: No .mp4 at the end)
        var videoSrc = 'https://mux.dev';
        var video = document.getElementById('my-video');

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        }
        // Native support for Safari (Apple devices natively support HLS without libraries)
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }
    </script>

</body>
</html>
